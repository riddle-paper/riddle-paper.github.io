<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riddle Paper</title>
    <script type="module" src="./riddle-paper.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(218, 165, 32, 0.22), transparent 35%),
          linear-gradient(180deg, #090909 0%, #12100b 40%, #050505 100%);
        color: #f3dc91;
        font-family: "Georgia", "Times New Roman", serif;
      }
    </style>
  </head>
  <body>
    <riddle-paper></riddle-paper>
  </body>
</html>
